name: Benchmark Redmi 12C firmware CDN

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-firmware-cdn-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Compare Xiaomi firmware CDN endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Benchmark small HTTP Range samples
        run: |
          python3 scripts/benchmark-earth-firmware-cdn.py \
            --url "https://bigota.d.miui.com/OS1.0.16.0.UCVMIXM/earth_global_images_OS1.0.16.0.UCVMIXM_20260227.0000.00_14.0_global_b2ab987cbf.tgz" \
            --sample-bytes 8388608 \
            --timeout 45 \
            --output "$RUNNER_TEMP/earth-cdn-benchmark/report.json"

      - name: Upload CDN benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linsae-earth-cdn-benchmark
          path: ${{ runner.temp }}/earth-cdn-benchmark/report.json
          if-no-files-found: warn
          retention-days: 14
