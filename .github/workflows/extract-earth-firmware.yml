name: Extract Redmi 12C Fastboot firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/earth_metadata_audit.py"
      - "scripts/audit-earth-firmware.py"
      - "scripts/extract-fastboot-rom.py"
      - ".github/workflows/extract-earth-firmware.yml"

permissions:
  contents: read

concurrency:
  group: earth-firmware-extract
  cancel-in-progress: false

jobs:
  extract:
    name: Download, verify, and extract firmware images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check runner disk space
        run: df -h

      - name: Download direct Xiaomi firmware URL, verify MD5, and extract images
        run: |
          python3 scripts/extract-fastboot-rom.py \
            --download-url "https://cdnorg.d.miui.com/OS1.0.16.0.UCVMIXM/earth_global_images_OS1.0.16.0.UCVMIXM_20260227.0000.00_14.0_global_b2ab987cbf.tgz" \
            --expected-md5 "b2ab987cbfb0b980cbbdca7174542672" \
            --keep-archive \
            --output "$RUNNER_TEMP/linsae-earth-firmware"

      - name: Audit firmware structure offline
        run: |
          python3 scripts/audit-earth-firmware.py \
            --archive "$RUNNER_TEMP/linsae-earth-firmware/earth_global_images_OS1.0.16.0.UCVMIXM_20260227.0000.00_14.0_global_b2ab987cbf.tgz" \
            --images "$RUNNER_TEMP/linsae-earth-firmware/images" \
            --output "$RUNNER_TEMP/linsae-earth-firmware/firmware-structure-audit.json"

      - name: Upload firmware inventory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linsae-earth-firmware-report
          path: |
            ${{ runner.temp }}/linsae-earth-firmware/*.json
            ${{ runner.temp }}/linsae-earth-firmware/*.tsv
            ${{ runner.temp }}/linsae-earth-firmware/images/PGPT_EMMC
          if-no-files-found: warn
          retention-days: 7

      - name: Upload boot image for offline kernel and device-tree inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linsae-earth-boot-image
          path: ${{ runner.temp }}/linsae-earth-firmware/images/boot.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload LK bootloader for offline inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linsae-earth-lk-image
          path: ${{ runner.temp }}/linsae-earth-firmware/images/lk.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload preloader for offline platform inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linsae-earth-preloader
          path: ${{ runner.temp }}/linsae-earth-firmware/images/preloader_earth.bin
          if-no-files-found: warn
          retention-days: 7
